syntax = "proto3";

package infinity.admin.user;

import "common/common.proto";
import "common/pagination.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com.zhengpanone/infinity/grpc/admin";
option java_multiple_files = true;
option java_package = "com.zp.infinity.admin.grpc.user";

// 用户服务
service UserService {

  // 创建用户。
  rpc CreateUser(CreateUserRequest) returns (UserResponse);

   // 获取用户
  rpc GetUser(GetUserRequest) returns (UserResponse) ;

  rpc GetUserById (infinity.common.CommonId) returns (UserResponse);

  // 获取多个用户
  rpc GetUsers(GetUsersRequest) returns (UserResponse);
}

// 用户视图（与应用层 UserVO 对应；时间戳采用 RFC3339 字符串，避免额外依赖）。
message User {
  string id = 1;
  string username = 2;
  string email = 3;
  optional string phone = 4;
  string display_name = 5;
  optional string avatar_url = 6;
  bool email_verified = 7;
  bool phone_verified = 8;
  int64 login_count = 9;
  int64 failed_login_count = 10;
  google.protobuf.Timestamp created_at = 11;  // RFC3339
  google.protobuf.Timestamp updated_at = 12;  // RFC3339
}

// 创建用户请求。
message CreateUserRequest {
  string username = 1;
  string email = 2;
  optional string phone = 3;
  string password = 4;
  string display_name = 5;
  optional string avatar_url = 6;
}

// 获取用户请求
message GetUserRequest{
  oneof identifier {
    string user_id = 1;
    string username = 2;
    string email = 3;
    string phone = 4;
  }
  bool include_sensitive = 5;  // 是否包含敏感信息
  repeated string fields = 6;  // 指定返回字段
}

// 获取用户请求：二选一的标识。
message GetUsersRequest {
  repeated string user_ids = 1;
  infinity.common.Filter filter =2;
  infinity.common.PageRequest pagination = 3;
  repeated string fields = 4;
}

// 统一用户响应。
message UserResponse {
  User user = 1;
}
