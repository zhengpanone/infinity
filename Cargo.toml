[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
# infinity-proto 仍为空壳脚手架，暂不纳入构建，避免污染 Cargo.lock；正式开工时移除此行。
# exclude = ["crates/infinity-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Infinity Team"]
repository = "https://github.com/zhengpanone/infinity"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
toml = "1.1.2"

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "macros",
] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"

# 异步运行时与 Web 框架（供各应用服务复用，统一版本）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"

# grpc
tonic = "0.14.2"
tonic-prost = "0.14.3"
prost-types = "0.14.1"
tonic-health = "0.14.2"
tonic-reflection = "0.14.2"
