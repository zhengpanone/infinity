[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Infinity Team"]
repository = "https://github.com/zhengpanone/infinity"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.16.1"
serde_json = "1.0.150"
serde_yaml = "0.9.34"
toml = "1.1.2"

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "rust_decimal",
    "macros",
] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"

# 异步运行时与 Web 框架（供各应用服务复用，统一版本）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"

# API Documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
utoipa-axum = { version = "0.2.0" }
utoipa-redoc = { version = "6.0.0", features = ["axum"] }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# grpc
tonic = "0.14.2"
tonic-prost = "0.14.3"
prost-types = "0.14.1"
tonic-health = "0.14.2"
tonic-reflection = "0.14.2"

validator = { version = "0.20.0" }

regex = "1.13.0"

argon2 = "0.5.3"
password-hash = { version = "0.5", features = ["rand_core", "getrandom"] }

async-trait = "0.1.89"
tower = "0.5"

# 审计日志哈希链
sha2 = "0.10"
hex = "0.4"
