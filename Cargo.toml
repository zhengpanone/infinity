[workspace]
resolver = "3"

members = ["apps/*", "crates/*"]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["郑攀"]
repository = "https://github.com/zhengpanone/infinity"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "macros",
] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
